[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronekonek"
version = "0.1.0"
description = "Drone-to-drone coordinate sharing over WiFi (MQTT) for ArduPilot/PX4 swarms"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DroneKonek" }]
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
mavlink = ["pymavlink>=2.4"]
crypto = ["cryptography>=42.0"]
# Secure mode needs both: paho for the link, cryptography for the sealing.
secure = ["paho-mqtt>=2.0", "cryptography>=42.0"]
# End-to-end tests: a real MQTT broker to test against.
test = ["paho-mqtt>=2.0", "cryptography>=42.0", "amqtt>=0.13"]
all = ["paho-mqtt>=2.0", "pymavlink>=2.4", "cryptography>=42.0", "amqtt>=0.13"]

[project.scripts]
dronekonek = "dronekonek.cli:main"

[tool.setuptools.packages.find]
include = ["dronekonek*"]
